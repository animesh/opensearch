report_comment: >
  This report has been generated by the <a href="https://github.com/nf-core/opensearch/tree/dev" target="_blank">nf-core/opensearch</a>
  analysis pipeline. The OpenSearch Executive Summary integrates FragPipe, Casanovo and AA_stat results.
  Each integrated section retains source-file provenance, with direct links to published source outputs.

# Keep custom-content ordering in one place. The previous report_section_order
# referred to custom-content IDs as if they were MultiQC module names, which
# produced noisy "module not found" messages.
custom_content:
  order:
    - opensearch_executive_summary
    - opensearch_generalstats
    - ptm_shepherd_modification_landscape
    - precursor_charge_distribution
    - missed_cleavage_distribution
    - identification_funnel
    - opensearch_casanovo_confidence
    - casanovo_fragpipe_sequence_overlap
    - opensearch_aastat_annotations
    - protein_level_reproducibility
    - sample_qc_flags
    - opensearch_provenance
    - opensearch_source_reports
    - opensearch_observations

# Plot export is disabled deliberately. MultiQC 1.x versions may emit colour
# conversion warnings while exporting plots even though the HTML report is valid.
export_plots: false
disable_version_detection: true

sp:
  fragpipe_stats:
    fn: "*_fragpipe_mqc.tsv"
  casanovo_stats:
    fn: "*_casanovo_mqc.tsv"
  aastat_stats:
    fn: "*_aastat_mqc.tsv"

custom_data:
  fragpipe_stats:
    id: "fragpipe_stats"
    section_name: "FragPipe Results"
    description: "PSM, peptide and protein identification counts per sample."
    plot_type: "generalstats"
    pconfig:
      psm_count:
        title: "PSMs"
        description: "Number of PSMs"
        min: 0
        format: "{:,.0f}"
      peptide_count:
        title: "Peptides"
        description: "Number of unique peptides"
        min: 0
        format: "{:,.0f}"
      protein_count:
        title: "Proteins"
        description: "Number of identified proteins"
        min: 0
        format: "{:,.0f}"
  casanovo_stats:
    id: "casanovo_stats"
    section_name: "Casanovo De Novo Sequencing"
    description: "Spectra sequenced and confidence score counts per sample."
    plot_type: "generalstats"
    pconfig:
      sequenced_spectra:
        title: "Sequenced"
        description: "Spectra sequenced by Casanovo"
        min: 0
        format: "{:,.0f}"
      score_ge_50pct:
        title: "Score>=0.5"
        description: "Spectra with confidence score >= 0.5"
        min: 0
        format: "{:,.0f}"
      score_ge_90pct:
        title: "Score>=0.9"
        description: "Spectra with confidence score >= 0.9"
        min: 0
        format: "{:,.0f}"
  aastat_stats:
    id: "aastat_stats"
    section_name: "AA_stat Modification Profiling"
    description: "Mass-shift and localized mass-shift-bin counts from AA_stat."
    plot_type: "generalstats"
    pconfig:
      n_mass_shifts:
        title: "Mass Shifts"
        description: "Number of significant mass shifts detected"
        min: 0
        format: "{:,.0f}"
      n_localizations:
        title: "Localized bins"
        description: "Number of mass-shift bins with localization evidence"
        min: 0
        format: "{:,.0f}"
