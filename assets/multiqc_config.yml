report_comment: >
  This report has been generated by the <a href="https://github.com/nf-core/opensearch/tree/dev" target="_blank">nf-core/opensearch</a>
  analysis pipeline. The OpenSearch Run Summary is the single authoritative General Statistics table and integrates
  FragPipe, PTM-Shepherd, Casanovo and AA_stat results without duplicating tool-specific count columns.
  Detailed sections retain source-file provenance and links to the published source outputs.

custom_content:
  order:
    - opensearch_generalstats
    - opensearch_spectrum_identification_overview
    - ptm_shepherd_modification_landscape
    - precursor_charge_distribution
    - missed_cleavage_distribution
    - opensearch_casanovo_confidence
    - casanovo_fragpipe_sequence_overlap
    - casanovo_fragpipe_harmonized_peptide_comparison
    - optional_tool_status
    - opensearch_aastat_annotations
    - protein_level_reproducibility
    - sample_qc_flags
    - opensearch_source_reports
    - opensearch_observations
    - opensearch_provenance

# The individual *_mqc.tsv files remain published for backwards compatibility,
# but are intentionally not fed to MultiQC. Otherwise their PSM/peptide/protein
# generalstats columns are duplicated in the global General Statistics section.
export_plots: false
disable_version_detection: true
